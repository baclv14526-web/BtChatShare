name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from version.properties
        id: version
        run: |
          VERSION_NAME=$(grep "^VERSION_NAME=" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_CODE=$(grep "^VERSION_CODE=" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME | VERSION_CODE=$VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"  \
            "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # --info để thấy lỗi Kotlin compiler đầy đủ nếu build thất bại
      - name: Build debug APK
        run: ./gradlew assembleDebug --info --stacktrace --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # In lỗi ra riêng khi build thất bại
      - name: Show errors if failed
        if: failure()
        run: |
          echo "=== Kotlin / AAPT errors ==="
          grep -E "error:|\.kt:[0-9]+|exception:|Exception" build.log | grep -v "^w:" | head -80 || true

      # Đổi tên APK theo format BtChatShare_{version}_debug.apk
      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          VERSION="${{ steps.version.outputs.name }}"
          DEST="app/build/outputs/apk/debug/BtChatShare_${VERSION}_debug.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Renamed: $DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BtChatShare_${{ steps.version.outputs.name }}_debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## ✅ Build thành công" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.name }}\` (code ${{ steps.version.outputs.code }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | \`BtChatShare_${{ steps.version.outputs.name }}_debug.apk\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 Tải APK ở mục **Artifacts** phía trên." >> "$GITHUB_STEP_SUMMARY"
