name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Đọc version từ version.properties ─────────────────────────────────
      - name: Read version from version.properties
        id: version
        run: |
          VERSION_NAME=$(grep "^VERSION_NAME=" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_CODE=$(grep "^VERSION_CODE=" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "name=$VERSION_NAME"  >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE"  >> "$GITHUB_OUTPUT"
          echo "▶ VERSION_NAME=$VERSION_NAME | VERSION_CODE=$VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"  \
            "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── Build debug (nhanh, không cần ký) ─────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ── Tìm APK vừa build và đổi tên về đúng format nếu cần ─────────────
      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "▶ APK tìm thấy: $APK_PATH"

      # ── Upload artifact với tên chứa version ──────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # Tên artifact hiển thị trên GitHub Actions UI
          name: BtChatShare_${{ steps.version.outputs.name }}_debug
          # File thực tế đã được đặt tên đúng bởi build.gradle.kts
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # ── In tóm tắt vào GitHub Actions summary ─────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ Build thành công" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Thông tin | Giá trị |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Name | \`${{ steps.version.outputs.name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Code | \`${{ steps.version.outputs.code }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | \`BtChatShare_${{ steps.version.outputs.name }}_debug.apk\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 Tải APK ở mục **Artifacts** phía trên." >> "$GITHUB_STEP_SUMMARY"
